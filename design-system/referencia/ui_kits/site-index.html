<!-- @dsCard group="Site institucional" viewport="1280x760" name="Site — página única" subtitle="Hero, serviços, sobre, equipamentos, portfólio, contato e rodapé" -->
<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ativa Consultoria — site institucional (UI kit)</title>
<link rel="stylesheet" href="../../styles.css">
<style>
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--site-bg);color:var(--site-text);font-family:var(--font-site)}
h1,h2,h3,h4{font-family:var(--font-site)}
a{color:inherit;text-decoration:none}a:hover{color:var(--site-accent)}
img{display:block}
#root{min-height:100vh}
.controles{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(10,13,11,.92);border:1px solid var(--site-border)}
.controles button{height:32px;padding:0 12px;border-radius:999px;border:none;background:transparent;color:#dfe3df;font-family:var(--font-site);font-size:11px;font-weight:800;cursor:pointer}
.controles button[data-ativo="true"]{background:var(--site-accent);color:#071005}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="Cabecalho.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Servicos.jsx"></script>
<script type="text/babel" src="Sobre.jsx"></script>
<script type="text/babel" src="Equipamentos.jsx"></script>
<script type="text/babel" src="Portfolio.jsx"></script>
<script type="text/babel" src="Rodape.jsx"></script>
<script type="text/babel">
function Site() {
  const [atual, setAtual] = React.useState("Início");
  const [estreito, setEstreito] = React.useState(false);
  return (
    <div style={{ margin: "0 auto", width: estreito ? 430 : "100%", borderLeft: estreito ? "1px solid var(--site-border)" : "none", borderRight: estreito ? "1px solid var(--site-border)" : "none", overflow: "hidden" }}>
      <window.Cabecalho atual={atual} aoNavegar={setAtual} estreito={estreito} />
      <window.Hero estreito={estreito} />
      <window.Servicos estreito={estreito} />
      <window.Sobre estreito={estreito} />
      <window.Equipamentos estreito={estreito} />
      <window.Portfolio estreito={estreito} />
      <window.Contato estreito={estreito} />
      <window.Rodape estreito={estreito} />
      <div className="controles">
        <button data-ativo={!estreito} onClick={() => setEstreito(false)}>Desktop</button>
        <button data-ativo={estreito} onClick={() => setEstreito(true)}>Celular</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Site />);
</script></body></html>
