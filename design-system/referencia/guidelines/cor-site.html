<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Paleta do site</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p g" style="grid-template-columns:repeat(5,1fr);background:#090b0a">
<div class="sw" style="background:#090b0a;color:#f7f8f6;border-color:#292d2a"><span class="nm">--site-bg</span><span class="hx">#090b0a</span></div>
<div class="sw" style="background:#0d0f0e;color:#f7f8f6;border-color:#292d2a"><span class="nm">--site-bg-alt</span><span class="hx">#0d0f0e</span></div>
<div class="sw" style="background:#292d2a;color:#f7f8f6;border-color:#292d2a"><span class="nm">--site-border</span><span class="hx">#292d2a</span></div>
<div class="sw" style="background:#a9afaa;color:#090b0a;border-color:#292d2a"><span class="nm">--site-text-muted</span><span class="hx">#a9afaa</span></div>
<div class="sw" style="background:#69d500;color:#071005;border-color:#69d500"><span class="nm">--site-accent</span><span class="hx">#69d500</span></div>
</div></body></html>
