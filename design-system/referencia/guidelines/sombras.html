<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sombras</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;gap:14px;background:var(--background-light);align-items:center;height:100%">
<div style="width:150px;height:84px;border-radius:14px;background:#fff;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:flex-end;padding:10px;font-size:10px;font-weight:700">--card-shadow</div>
<div style="width:150px;height:84px;border-radius:14px;background:#fff;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05);display:flex;align-items:flex-end;padding:10px;font-size:10px;font-weight:700">--sombra-sm</div>
<div style="width:150px;height:84px;border-radius:14px;background:#fff;border:1px solid var(--border);box-shadow:0 4px 6px -1px rgba(0,0,0,.1);display:flex;align-items:flex-end;padding:10px;font-size:10px;font-weight:700">--sombra-md · hover</div>
<div style="width:150px;height:84px;border-radius:14px;background:#fff;border:1px solid var(--border);box-shadow:0 10px 15px -3px rgba(0,0,0,.1);display:flex;align-items:flex-end;padding:10px;font-size:10px;font-weight:700">--sombra-lg · diálogo</div>
</div></body></html>
