<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Semáforo</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#9ab137;color:#fff"><span class="nm">verde</span><span class="hx">faltam 12 d</span></div>
<div class="sw" style="background:#f59e0b;color:#fff"><span class="nm">âmbar --ambar</span><span class="hx">faltam 5 d</span></div>
<div class="sw" style="background:oklch(0.52 0.21 27.325);color:#fff"><span class="nm">vermelho --destructive</span><span class="hx">vencido há 4 d</span></div>
<div class="sw" style="background:#999999;color:#fff"><span class="nm">cinza</span><span class="hx">sem prazo</span></div>
</div></body></html>
