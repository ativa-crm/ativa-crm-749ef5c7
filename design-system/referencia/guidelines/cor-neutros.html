<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Neutros</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p g" style="grid-template-columns:repeat(5,1fr)">
<div class="sw" style="background:#f7f8f5"><span class="nm">--background-light</span><span class="hx">#f7f8f5</span></div>
<div class="sw" style="background:#ffffff"><span class="nm">--card</span><span class="hx">#ffffff</span></div>
<div class="sw" style="background:#eeeeee"><span class="nm">--border / --input</span><span class="hx">#eeeeee</span></div>
<div class="sw" style="background:#999999;color:#fff"><span class="nm">--muted</span><span class="hx">#999999</span></div>
<div class="sw" style="background:#333333;color:#fff"><span class="nm">--foreground</span><span class="hx">#333333</span></div>
</div></body></html>
