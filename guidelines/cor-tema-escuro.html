<!-- @dsCard group="Cores" viewport="700x150" name="Tema escuro" subtitle="Grafites do .dark — o verde não muda" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Tema escuro</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p g" style="grid-template-columns:repeat(5,1fr);background:#101414">
<div class="sw" style="background:#101414;color:#ececec"><span class="nm">--background-light</span><span class="hx">#101414</span></div>
<div class="sw" style="background:#191d1d;color:#ececec"><span class="nm">--card</span><span class="hx">#191d1d</span></div>
<div class="sw" style="background:#232827;color:#ececec"><span class="nm">--secondary</span><span class="hx">#232827</span></div>
<div class="sw" style="background:#2c3130;color:#ececec"><span class="nm">--border</span><span class="hx">#2c3130</span></div>
<div class="sw" style="background:#8b918f;color:#101414"><span class="nm">--muted</span><span class="hx">#8b918f</span></div>
</div></body></html>
