<!-- @dsCard group="Cores" viewport="700x150" name="Verde da marca" subtitle="Primário do CRM: #9ab137 e seu hover #7e9530" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Verde da marca</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#9ab137;color:#fff"><span class="nm">--primary</span><span class="hx">#9ab137</span></div>
<div class="sw" style="background:#7e9530;color:#fff"><span class="nm">--primary-dark</span><span class="hx">#7e9530 · hover</span></div>
<div class="sw" style="background:#69d500;color:#071005"><span class="nm">--verde-vivo</span><span class="hx">#69d500 · site</span></div>
<div class="sw" style="background:#73d52d;color:#071005"><span class="nm">--verde-legado</span><span class="hx">#73d52d · theme-color</span></div>
</div></body></html>
