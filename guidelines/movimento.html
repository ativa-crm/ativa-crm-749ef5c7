<!-- @dsCard group="Forma" viewport="700x150" name="Movimento" subtitle="180–200ms, ease padrão, elevação de 1px. Nada de bounce." -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Movimento</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:600">
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Cartões e filtros</span><span style="color:var(--muted-foreground)">180ms ease · translateY(-1px)</span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Botões, inputs, itens de menu</span><span style="color:var(--muted-foreground)">200ms ease</span></div>
<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:6px"><span>Hover do site institucional</span><span style="color:var(--muted-foreground)">280ms ease · translateY(-2px)</span></div>
<div style="display:flex;justify-content:space-between"><span>Entrada por scroll (só no site)</span><span style="color:var(--muted-foreground)">700ms cubic-bezier(.2,.7,.2,1)</span></div>
</div></body></html>
