<!-- @dsCard group="Tipografia" viewport="700x170" name="Caixa alta" subtitle="Onde o produto grita: botões, menu, h2 e filtros" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Caixa alta</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
<span style="display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:999px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;text-transform:uppercase">Novo imóvel</span>
<span style="display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;text-transform:uppercase">Rural</span>
<span style="display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#000;color:#eee;font-size:16px;font-weight:700;text-transform:uppercase">Imóveis</span>
</div>
<h2 style="display:table;margin:0;padding-bottom:.35rem;border-bottom:2px solid var(--primary);font-size:20px;font-weight:600;text-transform:uppercase">Documentos</h2>
<p style="margin:0;font-size:13px;color:var(--muted-foreground);font-weight:500">Corpo, títulos de tela (h1) e nomes próprios NUNCA vão em caixa alta.</p>
</div></body></html>
