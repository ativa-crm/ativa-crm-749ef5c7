<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;gap:16px;align-items:center;height:100%">
<div style="flex:1;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center"><img src="../assets/brand/logo-ativa.png" alt="Ativa Consultoria" style="max-width:100%;max-height:120px;object-fit:contain"></div>
<div style="flex:1;background:#000;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px">
<span style="display:flex;height:48px;width:80px;align-items:center;justify-content:center;overflow:hidden;border-radius:6px;background:#fff;padding:4px;box-shadow:inset 0 0 0 1px #333"><img src="../assets/brand/logo-ativa.png" alt="" style="height:100%;width:100%;object-fit:contain"></span>
<span style="color:#eee;font-size:15px;font-weight:800;text-transform:uppercase">Ativa Consultoria</span></div>
</div></body></html>
