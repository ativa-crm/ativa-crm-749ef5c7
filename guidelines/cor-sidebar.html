<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sidebar</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw" style="background:#000000;color:#eeeeee"><span class="nm">--sidebar</span><span class="hx">#000000</span></div>
<div class="sw" style="background:#0d181c;color:#fff"><span class="nm">--sidebar-accent</span><span class="hx">#0d181c · hover</span></div>
<div class="sw" style="background:#333333;color:#fff"><span class="nm">--sidebar-border</span><span class="hx">#333333</span></div>
<div class="sw" style="background:#9ab137;color:#fff"><span class="nm">--sidebar-primary</span><span class="hx">#9ab137 · item ativo</span></div>
</div></body></html>
