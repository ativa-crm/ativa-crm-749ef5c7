<!-- @dsCard group="Espaçamento" viewport="700x200" name="Alvos de toque" subtitle="O usuário é técnico em campo, em pé, com uma mão só" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Alvos</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--card);color:var(--foreground)}.p{padding:16px}.g{display:grid;gap:8px}.sw{border-radius:10px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border)}.nm{font-size:11px;font-weight:700;line-height:1.2}.hx{font-size:10px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}</style></head><body><div class="p" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:12px"><span style="display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:999px;background:var(--secondary);border:1px solid var(--border);font-size:13px;font-weight:700">36px</span><span style="font-size:12px;color:var(--muted-foreground);font-weight:600">padrão de desktop (h-9)</span></div>
<div style="display:flex;align-items:center;gap:12px"><span style="display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;border-radius:999px;background:var(--primary);color:#fff;font-size:14px;font-weight:700">44px</span><span style="font-size:12px;color:var(--muted-foreground);font-weight:600">mínimo tocável — busca e ações de topo (h-11)</span></div>
<div style="display:flex;align-items:center;gap:12px"><span style="display:inline-flex;align-items:center;justify-content:center;height:56px;padding:0 20px;border-radius:12px;background:var(--card);border:2px solid var(--border);font-size:16px;font-weight:700">56px</span><span style="font-size:12px;color:var(--muted-foreground);font-weight:600">campo de formulário e CTA em campo (h-14)</span></div>
</div></body></html>
